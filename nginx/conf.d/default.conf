# Login tezlik cheklovi: daqiqasiga 10 ta har bir IP uchun (nginx r/h ni qabul qilmaydi;
# mobil operatorlarda ko'p foydalanuvchi bitta IP ortida chiqadi)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# Docker DNS: konteyner qayta yaratilsa IP o'zgaradi — nginx uni qayta aniqlaydi
# (aks holda eski IP ushlanib qoladi va deploydan keyin 502 bo'ladi).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}


server {
    listen 80;
    server_name _;

    # Login yo'li uchun tezlik cheklovi
    location = /api/v1/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin paneli
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media fayllar (rasmlar, audio)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django statik fayllar
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

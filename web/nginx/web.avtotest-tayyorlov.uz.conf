# web.avtotest-tayyorlov.uz — Avtotest web (o'quvchi sayti, web/student)
#
# O'rnatish (serverda, bir marta):
#   cp web/nginx/web.avtotest-tayyorlov.uz.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d web.avtotest-tayyorlov.uz      # HTTPS (shart: WebCrypto)
#
# Brauzer faqat shu domenga murojaat qiladi: statik sayt, shifrlangan kanal
# (/api/v1/s/) va rasmlar. Boshqa API yo'llari bu domendan ochilmaydi.

server {
    listen 80;
    server_name web.avtotest-tayyorlov.uz;

    root /var/www/avtotest-web-student;
    index index.html;

    # Shifrlangan kanal — backend (docker, 127.0.0.1:8010)
    location ~ ^/api/v1/s/(key/)?$ {
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/snippets/avtotest-proxy.conf;
        client_max_body_size 64k;
    }

    # Qolgan API yo'llari bu domendan yopiq
    location /api/ {
        return 404;
    }

    # Rasm/audio — diskdan to'g'ridan-to'g'ri (admin domenidagi kabi)
    location /media/ {
        alias /root/avtotest/avtotest-online/backend/media/;
        expires 30d;
        access_log off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

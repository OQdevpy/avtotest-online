version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: avtotest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "9005:8000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/avtotest_db
      - DEBUG=1
    depends_on:
      - db

volumes:
  postgres_data:

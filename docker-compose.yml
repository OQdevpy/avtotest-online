services:
  db:
    image: postgres:15-alpine
    container_name: avtotest_db
    environment:
      POSTGRES_DB: ${DB_NAME:-avtotest}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-avtotest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: avtotest_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-avtotest}
    volumes:
      - ./backend/media:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: avtotest_admin
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: avtotest_nginx
    ports:
      - "${WEB_PORT:-9005}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/media:/var/www/media:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - admin
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
